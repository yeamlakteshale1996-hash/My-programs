<body>
    
<form action="/register" method="get">
    <lable for="Username">Fullname</lable><br>
    <input type="text" name="username"><br>

    <lable for="password">Password</lable><br>
    <input type="Password" name="password"placeholder="Enter your password" min="4" max="6" ><br>

    <lable for="Phonenumber">Phonenumber</lable><br>
    <input type="Phonenumber" name="phonenumber" placeholder="+251"><br>

<lable for="email">Email</lable><br>
    <input type="email" id="email" name="email" required><br>  
    
    
    <lable for="Date">Year of study</lable>
     <input type="radio" name="Year" id=""> 2024
      <input type="radio" name="Year" id=""> 2025
       <input type="radio" name="Year" id=""> 2026<br>

    <lable for="interest"></lable>
    <input type="checkbox" name="interest" id="web">web</lable>
    <input type="checkbox" name="interest"id="programming">programming</lable> 
    <input type="checkbox" name="interest"id="cybersecurity">cybersecurity</lable><br>

    <lable for="dept">Depatrment</lable>
     <select name="dept" id="Select Department">
        <option value="CSE">Computer science</option>
        <option value="EEE">Web</option>
       <option value="ME">DSA</option></select>
       <br>
       <button type="submit">Register</button> <br>
     <p>Why join?</p>
       <textarea name="message" id=""cols="30" rows="4"> </textarea>




</body>
